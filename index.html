/* ─── CART STORE ─── */
const CartContext = createContext(null);
const useCart = () => useContext(CartContext);

function CartProvider({ children }) {
  const [cart, setCart] = useState(() => { try { return JSON.parse(localStorage.getItem('elara_cart')||'[]'); } catch { return []; } });
  const [wishlist, setWishlist] = useState(() => { try { return JSON.parse(localStorage.getItem('elara_wish')||'[]'); } catch { return []; } });
  useEffect(() => { localStorage.setItem('elara_cart', JSON.stringify(cart)); }, [cart]);
  useEffect(() => { localStorage.setItem('elara_wish', JSON.stringify(wishlist)); }, [wishlist]);
  const addToCart = (product, size, qty=1) => setCart(prev => {
    const key=`${product.id}-${size}`, ex=prev.find(i=>i.key===key);
    return ex ? prev.map(i=>i.key===key?{...i,qty:i.qty+qty}:i) : [...prev,{...product,size,qty,key}];
  });
  const removeFromCart = key => setCart(prev=>prev.filter(i=>i.key!==key));
  const updateQty = (key,qty) => { if(qty<1){removeFromCart(key);return;} setCart(prev=>prev.map(i=>i.key===key?{...i,qty}:i)); };
  const clearCart = () => setCart([]);
  const toggleWish = id => setWishlist(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);
  const isWished = id => wishlist.includes(id);
  const cartTotal = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const cartCount = cart.reduce((s,i)=>s+i.qty,0);
  return <CartContext.Provider value={{cart,addToCart,removeFromCart,updateQty,clearCart,wishlist,toggleWish,isWished,cartTotal,cartCount}}>{children}</CartContext.Provider>;
}

/* ─── TOAST ─── */
function Toast({ msg, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2400); return () => clearTimeout(t); }, []);
  return <div className="toast">{Icon.check} {msg}</div>;
}

/* ─── NAVBAR ─── */
function Navbar({ page, setPage, openCart, dark, toggleDark }) {
  const { cartCount } = useCart();
  return (
    <nav className="nav">
      <div className="nav-inner">
        <div className="logo" onClick={() => setPage('home')}>Él<span>ara</span></div>
        <div className="nav-links">
          {['home','shop','about'].map(p => (
            <span key={p} className={`nav-link ${page===p?'active':''}`} onClick={() => setPage(p)}>
              {p==='home'?'Home':p==='shop'?'Shop':'About'}
            </span>
          ))}
        </div>
        <div className="nav-actions">
          {/* ── THEME TOGGLE ── */}
          <button className="theme-toggle" onClick={toggleDark} title={dark?'Switch to light mode':'Switch to dark mode'} aria-label="Toggle theme">
            {dark ? <SunIcon /> : <MoonIcon />}
          </button>
          <button className="icon-btn" onClick={() => setPage('shop')} title="Search">{Icon.search}</button>
          <button className="icon-btn" onClick={() => setPage('shop')} title="Wishlist">{Icon.heart(false)}</button>
          <button className="icon-btn" onClick={openCart} title="Cart">
            {Icon.bag}
            {cartCount > 0 && <span className="badge">{cartCount}</span>}
          </button>
        </div>
      </div>
    </nav>
  );
}

/* ─── CART DRAWER ─── */
function CartDrawer({ open, onClose, setPage }) {
  const { cart, removeFromCart, updateQty, cartTotal, clearCart } = useCart();
  if (!open) return null;
  return (
    <>
      <div className="drawer-overlay" onClick={onClose} />
      <div className="drawer">
        <div className="drawer-head">
          <span className="drawer-title">Your Bag ({cart.length})</span>
          <button className="icon-btn" onClick={onClose}>{Icon.close}</button>
        </div>
        <div className="drawer-body">
          {cart.length === 0 ? (
            <div className="empty-cart">
              <div className="empty-cart-title">Your bag is empty</div>
              <p style={{fontSize:'0.82rem',marginBottom:'1.5rem'}}>Add some pieces to get started.</p>
              <button className="btn-gold" style={{fontSize:'0.72rem',padding:'12px 28px'}} onClick={onClose}>Continue Shopping</button>
            </div>
          ) : cart.map(item => (
            <div key={item.key} className="cart-item">
              <div className="cart-thumb"><ProductVisual product={item} size="small" /></div>
              <div>
                <div className="cart-item-name">{item.name}</div>
                <div className="cart-item-size">Size: {item.size}</div>
                <div className="cart-item-price">GH₵ {(item.price*item.qty).toLocaleString()}</div>
                <div className="qty-ctrl">
                  <button className="qty-btn" onClick={() => updateQty(item.key,item.qty-1)}>{Icon.minus}</button>
                  <span className="qty-num">{item.qty}</span>
                  <button className="qty-btn" onClick={() => updateQty(item.key,item.qty+1)}>{Icon.plus}</button>
                </div>
              </div>
              <button className="cart-remove" onClick={() => removeFromCart(item.key)}>{Icon.trash}</button>
            </div>
          ))}
        </div>
        {cart.length > 0 && (
          <div className="drawer-foot">
            <div className="cart-total">
              <span className="total-label">Subtotal</span>
              <span className="total-amount">GH₵ {cartTotal.toLocaleString()}</span>
            </div>
            <button className="btn-gold" style={{width:'100%',padding:'16px',fontSize:'0.78rem',letterSpacing:'0.15em'}}
              onClick={() => { onClose(); setPage('checkout'); }}>Proceed to Checkout</button>
            <button style={{width:'100%',marginTop:'0.5rem',background:'none',border:'none',color:'var(--subtle)',fontSize:'0.75rem',padding:'8px',cursor:'pointer'}}
              onClick={() => { if(window.confirm('Clear bag?')) clearCart(); }}>Clear Bag</button>
          </div>
        )}
      </div>
    </>
  );
}

/* ─── PRODUCT CARD ─── */
function ProductCard({ p, onView, onAdd, i=0 }) {
  const { toggleWish, isWished } = useCart();
  return (
    <div className="product-card fade-up" style={{ animationDelay:`${Math.min(i,8)*0.06}s` }}>
      <div className="card-img-wrap" onClick={() => onView(p)}>
        <ProductVisual product={p} />
        {p.badge && <span className="card-badge">{p.badge}</span>}
        <button className={`card-wish ${isWished(p.id)?'wished':''}`} onClick={e=>{e.stopPropagation();toggleWish(p.id);}}>
          {Icon.heart(isWished(p.id))}
        </button>
        <div className="card-overlay">
          <button className="btn-view" onClick={e=>{e.stopPropagation();onView(p);}}>View</button>
          <button className="btn-add" onClick={e=>{e.stopPropagation();onAdd(p);}}>Add to Bag</button>
        </div>
      </div>
      <div className="card-info">
        <p className="card-cat">{p.category}</p>
        <p className="card-name">{p.name}</p>
        <p className="card-price">GH₵ {p.price.toLocaleString()} {p.originalPrice&&<del>GH₵ {p.originalPrice.toLocaleString()}</del>}</p>
        <div className="card-stars">{Icon.star} {p.rating} <span style={{color:'var(--subtle)'}}>({p.reviews})</span></div>
      </div>
    </div>
  );
}

/* ─── HOME PAGE ─── */

  const { addToCart } = useCart();
  const [toast, setToast] = useState(null);
  const featured = PRODUCTS.filter(p=>p.badge==='New'||p.badge==='Exclusive').slice(0,4);
  const catCounts = CATEGORIES.filter(c=>c!=='All').map(c=>({name:c,count:PRODUCTS.filter(p=>p.category===c).length}));
  const addItem = p => { addToCart(p,p.sizes[0]); setToast(`${p.name} added to bag`); };
  const viewItem = p => { setProductDetail(p); setPage('product'); };

  return (
    <div>
      <section className="hero">
        <div className="hero-bg"/><div className="hero-lines"/>
        <div className="hero-content">
          <p className="hero-eyebrow">New Collection · Summer 2025</p>
          <h1 className="hero-title">Dressed in<br/><em>Élara</em></h1>
          <p className="hero-sub">Luxury Womenswear · Curated for the Modern Woman</p>
          <div className="hero-btns">
            <button className="btn-gold" onClick={() => setPage('shop')}>Shop the Collection</button>
            <button className="btn-outline" onClick={() => setPage('about')}>Our Story</button>
          </div>
        </div>
        <div className="hero-scroll"><div className="scroll-line"/><span className="scroll-text">Scroll</span></div>
      </section>

      <div className="marquee-bar">
        <div className="marquee-inner">
          {Array(8).fill(null).map((_,i)=>(
            <React.Fragment key={i}>
              <span className="marquee-item">Free Shipping Over GH₵500</span><span className="marquee-dot">◆</span>
              <span className="marquee-item">New Arrivals Every Week</span><span className="marquee-dot">◆</span>
              <span className="marquee-item">Curated Luxury Pieces</span><span className="marquee-dot">◆</span>
              <span className="marquee-item">Exclusive Members Offer</span><span className="marquee-dot">◆</span>
            </React.Fragment>
          ))}
        </div>
      </div>

      <div className="section" style={{paddingBottom:'2rem'}}>
        <div className="section-header"><div><p className="section-eyebrow">Browse by</p><h2 className="section-title">Shop Categories</h2></div></div>
        <div className="cat-strip">
          {catCounts.map(c=>(
            <div key={c.name} className="cat-card" onClick={() => setPage('shop')}>
              <span className="cat-name">{c.name}</span>
              <span className="cat-count">{c.count} pieces</span>
              <span className="cat-arrow">{Icon.arrow}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="section">
        <div className="section-header">
          <div><p className="section-eyebrow">Curated for you</p><h2 className="section-title">New Arrivals</h2></div>
          <span className="link-gold" onClick={() => setPage('shop')}>View All {Icon.chevronR}</span>
        </div>
        <div className="product-grid">
          {featured.map((p,i)=><ProductCard key={p.id} p={p} i={i} onView={viewItem} onAdd={addItem}/>)}
        </div>
      </div>

      <div style={{background:'var(--promo-bg)',borderTop:'1px solid var(--border)',borderBottom:'1px solid var(--border)',padding:'5rem 2rem',textAlign:'center',transition:'background 0.3s'}}>
        <p style={{fontSize:'0.65rem',letterSpacing:'0.3em',textTransform:'uppercase',color:'var(--gold)',marginBottom:'1rem'}}>Limited Time</p>
        <h2 style={{fontFamily:'Cormorant Garamond,serif',fontSize:'clamp(2rem,5vw,3.5rem)',fontWeight:300,color:'var(--text)',marginBottom:'1rem',transition:'color 0.3s'}}>
          Up to <span style={{color:'var(--gold)'}}>30% Off</span> Selected Pieces
        </h2>
        <p style={{color:'var(--muted)',fontSize:'0.85rem',marginBottom:'2rem'}}>Shop our curated sale selection — elevated style at exceptional value.</p>
        <button className="btn-gold" onClick={() => setPage('shop')}>Shop Sale</button>
      </div>

      <Footer setPage={setPage}/>
      {toast && <Toast msg={toast} onDone={() => setToast(null)}/>}
    </div>
  );
}

/* ─── SHOP PAGE ─── */
function ShopPage({ setPage, setProductDetail }) {
  const { addToCart } = useCart();
  const [cat, setCat] = useState('All');
  const [sort, setSort] = useState('newest');
  const [toast, setToast] = useState(null);
  let products = cat==='All' ? PRODUCTS : PRODUCTS.filter(p=>p.category===cat);
  if (sort==='price-asc') products=[...products].sort((a,b)=>a.price-b.price);
  if (sort==='price-desc') products=[...products].sort((a,b)=>b.price-a.price);
  if (sort==='rating') products=[...products].sort((a,b)=>b.rating-a.rating);
  const addItem = p => { addToCart(p,p.sizes[0]); setToast(`${p.name} added to bag`); };
  const viewItem = p => { setProductDetail(p); setPage('product'); };
  return (
    <div className="page">
      <div className="section" style={{paddingBottom:'1rem'}}>
        <p className="section-eyebrow">Our collection</p>
        <div className="section-header">
          <h1 className="section-title">All Pieces</h1>
          <select value={sort} onChange={e=>setSort(e.target.value)}
            style={{background:'var(--input-bg)',border:'1px solid var(--border-md)',color:'var(--muted)',padding:'8px 16px',fontSize:'0.75rem',fontFamily:'Jost,sans-serif',outline:'none',cursor:'pointer',transition:'background 0.3s'}}>
            <option value="newest">Newest First</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Highest Rated</option>
          </select>
        </div>
        <div className="filters">
          {CATEGORIES.map(c=><button key={c} className={`filter-btn ${cat===c?'active':''}`} onClick={()=>setCat(c)}>{c}</button>)}
        </div>
      </div>
      <div style={{maxWidth:'1280px',margin:'0 auto',padding:'0 2rem 5rem'}}>
        <div className="product-grid">
          {products.map((p,i)=><ProductCard key={p.id} p={p} i={i} onView={viewItem} onAdd={addItem}/>)}
        </div>
      </div>
      <Footer setPage={setPage}/>
      {toast && <Toast msg={toast} onDone={() => setToast(null)}/>}
    </div>
  );
}

/* ─── PRODUCT DETAIL ─── */
function ProductPage({ product, setPage, setProductDetail }) {
  const { addToCart, toggleWish, isWished } = useCart();
  const [size, setSize] = useState(null);
  const [toast, setToast] = useState(null);
  const handleAdd = () => {
    if (!size && product.sizes.length>1) { setToast('Please select a size'); return; }
    addToCart(product, size||product.sizes[0]);
    setToast(`${product.name} added to bag`);
  };
  const related = PRODUCTS.filter(p=>p.category===product.category&&p.id!==product.id).slice(0,4);
  return (
    <div className="page">
      <div className="section">
        <p style={{fontSize:'0.72rem',color:'var(--subtle)',marginBottom:'2rem',cursor:'pointer'}} onClick={() => setPage('shop')}>← Back to Shop</p>
        <div className="detail-wrap">
          <div className="detail-img"><ProductVisual product={product} size="large"/></div>
          <div>
            <p className="section-eyebrow">{product.category}</p>
            <h1 className="detail-title">{product.name}</h1>
            <div className="card-stars" style={{marginBottom:'1rem'}}>{Icon.star} {product.rating} <span style={{color:'var(--subtle)'}}>({product.reviews} reviews)</span></div>
            <div className="detail-price">GH₵ {product.price.toLocaleString()} {product.originalPrice&&<del style={{color:'var(--subtle)',fontSize:'1rem'}}>GH₵ {product.originalPrice.toLocaleString()}</del>}</div>
            <p className="detail-desc">{product.desc}</p>
            {product.sizes.length>1&&<>
              <p className="size-label">Select Size</p>
              <div className="size-grid">{product.sizes.map(s=><button key={s} className={`size-btn ${size===s?'selected':''}`} onClick={()=>setSize(s)}>{s}</button>)}</div>
            </>}
            <div className="detail-actions">
              <button className="btn-full" onClick={handleAdd}>Add to Bag</button>
              <button className={`btn-wish-lg ${isWished(product.id)?'wished':''}`} onClick={() => toggleWish(product.id)}>{Icon.heart(isWished(product.id))}</button>
            </div>
            <div className="detail-meta">
              <div className="meta-row">{Icon.truck} Free shipping on orders over GH₵ 500</div>
              <div className="meta-row">{Icon.check} Free returns within 14 days</div>
            </div>
          </div>
        </div>
        {related.length>0&&<div style={{marginTop:'5rem'}}>
          <div className="section-header"><div><p className="section-eyebrow">You may also like</p><h2 className="section-title">Related Pieces</h2></div></div>
          <div className="product-grid">
            {related.map(p=>(
              <div key={p.id} className="product-card" onClick={() => { setProductDetail(p); window.scrollTo(0,0); }}>
                <div className="card-img-wrap"><ProductVisual product={p}/>{p.badge&&<span className="card-badge">{p.badge}</span>}</div>
                <div className="card-info"><p className="card-cat">{p.category}</p><p className="card-name">{p.name}</p><p className="card-price">GH₵ {p.price.toLocaleString()}</p></div>
              </div>
            ))}
          </div>
        </div>}
      </div>
      <Footer setPage={setPage}/>
      {toast && <Toast msg={toast} onDone={() => setToast(null)}/>}
    </div>
  );
}

/* ─── CHECKOUT ─── */
function CheckoutPage({ setPage }) {
  const { cart, cartTotal, clearCart } = useCart();
  const [placed, setPlaced] = useState(false);
  const [form, setForm] = useState({fname:'',lname:'',email:'',phone:'',address:'',city:'',region:'Ghana',card:'',expiry:'',cvv:''});
  const upd = (k,v) => setForm(f=>({...f,[k]:v}));
  const handleOrder = () => {
    if (['fname','lname','email','address','city','card'].some(k=>!form[k].trim())) { alert('Please fill in all required fields.'); return; }
    clearCart(); setPlaced(true);
  };
  if (placed) return (
    <div className="page"><div className="success-wrap">
      <div className="success-icon">✓</div>
      <h1 className="success-title">Order Placed!</h1>
      <p className="success-sub">Thank you for shopping with Élara Boutique. You will receive a confirmation email shortly.</p>
      <div className="order-num">Order #EL-{Math.floor(Math.random()*90000+10000)}</div><br/>
      <button className="btn-gold" onClick={() => setPage('home')}>Return Home</button>
    </div></div>
  );
  if (cart.length===0) return (
    <div className="page"><div className="success-wrap">
      <h2 style={{fontFamily:'Cormorant Garamond,serif',fontSize:'2rem',color:'var(--text)',marginBottom:'1rem'}}>Your bag is empty</h2>
      <button className="btn-gold" onClick={() => setPage('shop')}>Continue Shopping</button>
    </div></div>
  );
  return (
    <div className="page"><div className="section">
      <p className="section-eyebrow">Secure Checkout</p>
      <h1 className="section-title" style={{marginBottom:'2.5rem'}}>Complete Your Order</h1>
      <div className="checkout-grid">
        <div>
          {[
            {n:1,t:'Contact Information',fields:[
              [{k:'fname',l:'First Name *',ph:'Ama'},{k:'lname',l:'Last Name *',ph:'Mensah'}],
              [{k:'email',l:'Email *',ph:'ama@example.com',type:'email'},{k:'phone',l:'Phone',ph:'+233 ...'}],
            ]},
            {n:2,t:'Delivery Address',fields:[
              [{k:'address',l:'Street Address *',ph:'123 Oxford Street',full:true}],
              [{k:'city',l:'City *',ph:'Accra'},{k:'region',l:'Region',ph:''}],
            ]},
          ].map(sec=>(
            <div key={sec.n} className="checkout-section">
              <h3 className="checkout-section-title"><span>{sec.n}</span> {sec.t}</h3>
              {sec.fields.map((row,ri)=>(
                <div key={ri} className={row[0].full?'form-group':'form-row'}>
                  {row.map(f=>(
                    <div key={f.k} className="form-group">
                      <label className="form-label">{f.l}</label>
                      <input className="form-input" type={f.type||'text'} value={form[f.k]} onChange={e=>upd(f.k,e.target.value)} placeholder={f.ph}/>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          ))}
          <div className="checkout-section">
            <h3 className="checkout-section-title"><span>3</span> Payment Details</h3>
            <div style={{background:'rgba(201,168,76,0.07)',border:'1px solid rgba(201,168,76,0.25)',padding:'0.75rem 1rem',marginBottom:'1rem',fontSize:'0.78rem',color:'var(--gold)'}}>
              🔒 This is a demo — no real payment is processed
            </div>
            <div className="form-group"><label className="form-label">Card Number *</label><input className="form-input" value={form.card} onChange={e=>upd('card',e.target.value)} placeholder="4242 4242 4242 4242" maxLength={19}/></div>
            <div className="form-row">
              <div className="form-group"><label className="form-label">Expiry</label><input className="form-input" value={form.expiry} onChange={e=>upd('expiry',e.target.value)} placeholder="MM/YY" maxLength={5}/></div>
              <div className="form-group"><label className="form-label">CVV</label><input className="form-input" value={form.cvv} onChange={e=>upd('cvv',e.target.value)} placeholder="123" maxLength={3}/></div>
            </div>
          </div>
          <button className="btn-gold" style={{width:'100%',padding:'18px',fontSize:'0.82rem',letterSpacing:'0.15em'}} onClick={handleOrder}>
            Place Order · GH₵ {cartTotal.toLocaleString()}
          </button>
        </div>
        <div className="order-summary">
          <p className="order-title">Order Summary</p>
          {cart.map(item=>(
            <div key={item.key} className="order-item">
              <span>{item.name} × {item.qty} <span style={{color:'var(--subtle)',fontSize:'0.75rem'}}>(Size: {item.size})</span></span>
              <strong>GH₵ {(item.price*item.qty).toLocaleString()}</strong>
            </div>
          ))}
          <hr className="order-divider"/>
          <div className="order-item"><span>Subtotal</span><strong>GH₵ {cartTotal.toLocaleString()}</strong></div>
          <div className="order-item"><span>Shipping</span><strong style={{color:'var(--gold)'}}>{cartTotal>=500?'Free':'GH₵ 50'}</strong></div>
          <div className="order-item"><span>Tax (0%)</span><strong>GH₵ 0</strong></div>
          <hr className="order-divider"/>
          <div className="order-total"><span>Total</span><span>GH₵ {(cartTotal+(cartTotal<500?50:0)).toLocaleString()}</span></div>
          <div style={{marginTop:'1.5rem',fontSize:'0.75rem',color:'var(--subtle)',lineHeight:1.6}}>By placing your order you agree to Élara's Terms of Service and Privacy Policy.</div>
        </div>
      </div>
    </div></div>
  );
}

/* ─── ABOUT ─── */

  return (
    <div className="page">
      <div style={{textAlign:'center',padding:'5rem 2rem 4rem',borderBottom:'1px solid var(--border)',background:'var(--bg-off)',transition:'background 0.3s'}}>
        <p className="section-eyebrow">Est. 2019 · Accra, Ghana</p>
        <h1 style={{fontFamily:'Cormorant Garamond,serif',fontSize:'clamp(2.5rem,6vw,5rem)',fontWeight:300,color:'var(--text)',marginBottom:'1.5rem',lineHeight:1,transition:'color 0.3s'}}>
          The <em style={{color:'var(--gold)',fontStyle:'italic'}}>Élara</em> Story
        </h1>
        <p style={{color:'var(--muted)',maxWidth:'560px',margin:'0 auto 2rem',lineHeight:1.9,fontSize:'0.9rem'}}>
          Born from a passion for refined womenswear and the belief that every woman deserves to feel extraordinary in what she wears.
        </p>
      </div>
      <div className="section" style={{maxWidth:'800px',margin:'0 auto'}}>
        {[
          {title:'Our Philosophy',body:'At Élara, we believe luxury is not just about price — it is about intention. Every piece in our collection is chosen with purpose, designed to transcend seasons and trends.'},

            <h2 style={{fontFamily:'Cormorant Garamond,serif',fontSize:'1.8rem',fontWeight:300,color:'var(--text)',marginBottom:'1rem',transition:'color 0.3s'}}>{s.title}</h2>
            <p style={{color:'var(--muted)',lineHeight:1.9,fontSize:'0.9rem'}}>{s.body}</p>

      <Footer setPage={setPage}/>
    </div>

}

/* ─── FOOTER ─── */
function Footer({ setPage }) {
  return (
    <footer className="footer">
      <div className="footer-inner">
        <div>
          <div className="footer-logo">Élara Boutique</div>
          <p className="footer-about">Luxury womenswear curated for the modern woman. Based in Accra, Ghana — shipping nationwide.</p>
        </div>
        <div><p className="footer-heading">Shop</p><ul className="footer-links">{CATEGORIES.filter(c=>c!=='All').map(c=><li key={c} onClick={()=>setPage('shop')}>{c}</li>)}</ul></div>
        <div><p className="footer-heading">Help</p><ul className="footer-links"><li>Sizing Guide</li><li>Returns</li><li>Shipping</li><li>FAQ</li><li>Contact Us</li></ul></div>
        <div><p className="footer-heading">Follow Us</p><ul className="footer-links"><li>Instagram</li><li>TikTok</li><li>Pinterest</li><li>Facebook</li></ul></div>
      </div>
      <div className="footer-bottom">
        <span className="footer-copy">© 2025 Élara Boutique. All rights reserved.</span>
        <div className="footer-cards">{['Visa','MTN','Vodafone','Mastercard'].map(c=><span key={c} className="card-chip">{c}</span>)}</div>
      </div>
    </footer>
  );
}

/* ─── APP ─── */
function App() {
  const [page, setPage] = useState('home');
  const [cartOpen, setCartOpen] = useState(false);
  const [productDetail, setProductDetail] = useState(null);
  const [dark, setDark] = useState(false);

  useEffect(() => { window.scrollTo(0,0); }, [page]);

  useEffect(() => {
    if (dark) { document.body.classList.add('dark'); }
    else { document.body.classList.remove('dark'); }
  }, [dark]);

  const toggleDark = () => setDark(d => !d);

  return (
    <CartProvider>
      <style>{css}</style>
      <Navbar page={page} setPage={setPage} openCart={() => setCartOpen(true)} dark={dark} toggleDark={toggleDark}/>
      <CartDrawer open={cartOpen} onClose={() => setCartOpen(false)} setPage={setPage}/>
      {page==='home' && <HomePage setPage={setPage} setProductDetail={setProductDetail}/>}
      {page==='shop' && <ShopPage setPage={setPage} setProductDetail={setProductDetail}/>}
      {page==='product' && productDetail && <ProductPage product={productDetail} setPage={setPage} setProductDetail={setProductDetail}/>}
      {page==='checkout' && <CheckoutPage setPage={setPage}/>}
      {page==='about' && <AboutPage setPage={setPage}/>}
    </CartProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
